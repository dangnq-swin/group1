<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="100%" height="100%" aria-labelledby="svg-title svg-desc" role="img">
  <title id="svg-title">Core Technology LMS</title>
  <desc id="svg-desc">Abstract wireframe illustration of Core Technology LMS interface styled with a 4:3 window shell</desc>
  <defs>
    <style>
      @font-face {
        font-family: 'Truculenta';
        src: url('../fonts/truculenta-latin.woff2') format('woff2');
      }
      .title-text {
        font-family: 'Truculenta', 'Alegreya Sans', system-ui, -apple-system, sans-serif;
        font-weight: 900;
        font-size: 13px;
        letter-spacing: 0.05em;
        fill: #FFFFFF;
      }
    </style>
    <!-- Drop Shadow Filter for Internal Panels (Darker Blue: #2E5F8F) -->
    <filter id="panel-shadow" x="-5%" y="-5%" width="125%" height="125%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#2E5F8F" flood-opacity="1" />
    </filter>
    <!-- Drop Shadow Filter for Window Shell (Dark Ink: #1A1815) -->
    <filter id="window-shadow" x="-5%" y="-5%" width="125%" height="125%">
      <feDropShadow dx="7" dy="7" stdDeviation="0" flood-color="#1A1815" flood-opacity="1" />
    </filter>
  </defs>

  <!-- Canvas Background (Transparent to let frame color show through) -->
  <rect width="480" height="360" fill="transparent" />

  <!-- 4:3 Window Shell: Container with Drop Shadow Filter (416 x 312 = exactly 4:3) -->
  <rect x="28" y="20" width="416" height="312" fill="#DFF5E9" stroke="#1A1815" stroke-width="3" filter="url(#window-shadow)" />

  <!-- Window Shell: Titlebar -->
  <rect x="28" y="20" width="416" height="38" fill="#2E5F8F" stroke="#1A1815" stroke-width="3" />
  
  <!-- Titlebar Title -->
  <text x="42" y="44" class="title-text">CORE TECHNOLOGY LMS v1.3.37</text>

  <!-- Window Shell: Control Buttons -->
  <g id="window-buttons">
    <!-- Minimize button -->
    <rect x="368" y="31" width="16" height="16" fill="#E6EFF9" stroke="#1A1815" stroke-width="1.8" />
    <line x1="371" y1="40" x2="381" y2="40" stroke="#1A1815" stroke-width="1.8" stroke-linecap="round" />

    <!-- Maximize button -->
    <rect x="390" y="31" width="16" height="16" fill="#E6EFF9" stroke="#1A1815" stroke-width="1.8" />
    <rect x="394" y="35" width="8" height="8" fill="none" stroke="#1A1815" stroke-width="1.8" />

    <!-- Close button -->
    <rect x="412" y="31" width="16" height="16" fill="#E6EFF9" stroke="#1A1815" stroke-width="1.8" />
    <path d="M415 34 l10 10 m0 -10 l-10 10" stroke="#1A1815" stroke-width="1.8" stroke-linecap="round" />
  </g>

  <!-- Window Content Area (All Straight / Sharp 90° Corners in Cool Blue Soft) -->
  <!-- Slim Left Sidebar Panel -->
  <rect x="40" y="68" width="56" height="252" fill="#E6EFF9" stroke="#1A1815" stroke-width="2" />
  
  <!-- Sidebar Abstract Items -->
  <rect x="48" y="78" width="40" height="12" fill="#2E5F8F" stroke="#1A1815" stroke-width="1.5" />
  
  <rect x="48" y="98" width="40" height="14" fill="#BFD8F0" stroke="#1A1815" stroke-width="1.5" />
  <rect x="53" y="103" width="24" height="4" fill="#1A1815" />

  <rect x="48" y="120" width="34" height="5" fill="#1A1815" />
  <rect x="48" y="131" width="26" height="5" fill="#5C5750" opacity="0.6" />
  <rect x="48" y="142" width="30" height="5" fill="#5C5750" opacity="0.6" />
  <rect x="48" y="153" width="22" height="5" fill="#5C5750" opacity="0.6" />

  <!-- Sidebar Divider line -->
  <line x1="45" y1="168" x2="91" y2="168" stroke="#1A1815" stroke-width="1.5" stroke-dasharray="3 3" />

  <rect x="48" y="178" width="34" height="5" fill="#5C5750" opacity="0.6" />
  <rect x="48" y="189" width="28" height="5" fill="#5C5750" opacity="0.6" />

  <!-- Bottom Mini Status Block (Coral accent) -->
  <rect x="48" y="294" width="40" height="18" fill="#FF6B4A" stroke="#1A1815" stroke-width="1.5" />
  <rect x="55" y="300" width="5" height="5" fill="#E6EFF9" stroke="#1A1815" stroke-width="1" />
  <rect x="63" y="301" width="16" height="3" fill="#E6EFF9" />

  <!-- Right Area: Top Abstract Card (Analytics - 4:3 Proportional Layout) -->
  <g id="abstract-card-top">
    <!-- Card with Filter Drop Shadow -->
    <rect x="108" y="68" width="324" height="120" fill="#E6EFF9" stroke="#1A1815" stroke-width="2" filter="url(#panel-shadow)" />
    
    <!-- Abstract Header Lines -->
    <rect x="122" y="80" width="135" height="8" fill="#1A1815" />
    <rect x="122" y="93" width="75" height="5" fill="#5C5750" opacity="0.6" />

    <!-- Abstract Bar Chart -->
    <rect x="122" y="132" width="20" height="44" fill="#2E5F8F" stroke="#1A1815" stroke-width="1.5" />
    <rect x="148" y="120" width="20" height="56" fill="#8FE3C0" stroke="#1A1815" stroke-width="1.5" />
    <rect x="174" y="110" width="20" height="66" fill="#FF6B4A" stroke="#1A1815" stroke-width="1.5" />
    <rect x="200" y="124" width="20" height="52" fill="#BFD8F0" stroke="#1A1815" stroke-width="1.5" />

    <!-- Abstract Info Badge & Lines (Cool Mint Badge) -->
    <rect x="246" y="112" width="174" height="24" fill="#DFF5E9" stroke="#1A1815" stroke-width="1.5" />
    <rect x="256" y="120" width="8" height="8" fill="#00785C" />
    <rect x="270" y="121" width="138" height="6" fill="#00785C" />

    <rect x="246" y="146" width="145" height="5" fill="#1A1815" />
    <rect x="246" y="157" width="115" height="5" fill="#5C5750" opacity="0.6" />
    <rect x="246" y="168" width="130" height="5" fill="#5C5750" opacity="0.4" />
  </g>

  <!-- Right Area: Bottom Abstract Card (Adaptive Tools - 4:3 Proportional Layout) -->
  <g id="abstract-card-bottom">
    <!-- Card with Filter Drop Shadow -->
    <rect x="108" y="200" width="324" height="120" fill="#E6EFF9" stroke="#1A1815" stroke-width="2" filter="url(#panel-shadow)" />
    
    <!-- Abstract Header Lines -->
    <rect x="122" y="212" width="145" height="8" fill="#1A1815" />
    <rect x="122" y="225" width="85" height="5" fill="#5C5750" opacity="0.6" />

    <!-- Abstract Spectrum / Waveform pipes -->
    <rect x="124" y="246" width="4" height="24" fill="#1A1815" />
    <rect x="133" y="238" width="4" height="40" fill="#FF6B4A" />
    <rect x="142" y="242" width="4" height="32" fill="#1A1815" />
    <rect x="151" y="232" width="4" height="52" fill="#2E5F8F" />
    <rect x="160" y="244" width="4" height="28" fill="#8FE3C0" />
    <rect x="169" y="236" width="4" height="44" fill="#1A1815" />

    <!-- Abstract Content Lines -->
    <rect x="190" y="244" width="228" height="6" fill="#1A1815" />
    <rect x="190" y="258" width="180" height="6" fill="#5C5750" opacity="0.7" />
    <rect x="190" y="272" width="130" height="6" fill="#5C5750" opacity="0.4" />

    <!-- Abstract Tags -->
    <rect x="122" y="292" width="95" height="18" fill="#F7EEED" stroke="#1A1815" stroke-width="1.2" />
    <rect x="132" y="298" width="75" height="5" fill="#1A1815" />

    <rect x="228" y="292" width="105" height="18" fill="#BFD8F0" stroke="#1A1815" stroke-width="1.2" />
    <rect x="238" y="298" width="85" height="5" fill="#2E5F8F" />
  </g>
</svg>
